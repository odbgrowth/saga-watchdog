# Copy to .saga-watchdog.yaml in your Git project, inspect, then run validate.
# Unspecified values come from the coding-agent profile.
version: 1
profile: coding-agent
mode: enforce

project:
  name: my-project

run:
  max_duration: 2h
  stop_grace_period: 5s
  # Unattended runs (CI, scripts): a pause denies further pre-action checks
  # but leaves the process running, since nobody is there to resume it.
  unattended: false

git:
  protected_branches: [main, master]
  allow_protected: false

filesystem:
  # More than this many distinct delete/rename paths in the window pauses a run.
  delete_threshold: 100
  delete_window: 10s
  # The profile protects policy, Git security files, CI and secret-like writes.
  # Default ignores skip node_modules, vendor, dist, build and .git/objects.
  # Omit protect/ignore here to retain the profile's path lists.

escalation:
  window: 120s
  warn_after: 2
  pause_after: 3
  kill_after: 5
  # A shell command right after a denial counts as an alternative route.
  shell_follow_up: true

network:
  # denylist (default): every host is allowed unless denied.
  # allowlist: a host must be in allow, or granted for the run with
  # `saga-watchdog grant network <host>`, or the check pauses the run.
  # A leading dot covers a domain and its subdomains. Deny always wins.
  # This governs cooperative checks only; no OS network traffic is blocked.
  mode: denylist
  allow: []
  deny: [blocked.example.com]
  # Pause on well-known URL shorteners unless allowed or granted explicitly.
  deny_redirectors: true

tools:
  # Same modes for cooperative tool calls by canonical identifier:
  # MCP tools as server/tool, other tools by name. Path-style globs apply.
  mode: denylist
  allow: []
  deny: [github/delete_repository, 'payments/*']

# Optional: keep enforced restrictions across runs and model sessions of the
# same operator (SAGA_WATCHDOG_OPERATOR), project and authorization context.
# See docs/authority.md. Without it, history stays per run.
# security_context:
#   authorization_context: dev-local
#   retention: 24h          # pause-level restrictions
#   serious_retention: 168h # kill-level restrictions

# Optional: name what a target achieves, so an alternate route to the same
# effect after a denial is recognized. Entries are type:pattern.
# effects:
#   production_deploy:
#     - network:deploy.example.com
#     - tool:vercel/deploy

# New agent instances, inference endpoints and remote execution are denied
# unless listed here. A child agent never inherits its parent's grants.
# replication:
#   same_host_workers: 0
#   allow_agents: []
#   inference_endpoints: []
#   remote_hosts: []
